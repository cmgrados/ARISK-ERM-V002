name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: arisk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov factory-boy faker

    - name: Run migrations
      env:
        DJANGO_SETTINGS_MODULE: config.settings.testing
        DATABASE_URL: sqlite:///db.sqlite3
      run: |
        python manage.py migrate --noinput

    - name: Run linting (Ruff)
      run: |
        pip install ruff
        ruff check apps/ config/ tests/ --select=E,F,W || true

    - name: Run type checking (mypy)
      run: |
        pip install mypy django-stubs
        mypy apps/ config/ --ignore-missing-imports || true

    - name: Run tests with pytest
      env:
        DJANGO_SETTINGS_MODULE: config.settings.testing
        DATABASE_URL: sqlite:///db.sqlite3
      run: |
        pytest tests/ -v --tb=short --cov=apps --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 60
        MINIMUM_ORANGE: 30

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security check
      run: |
        bandit -r apps/ config/ -f json -o bandit-report.json || true

    - name: Check dependencies for vulnerabilities
      run: |
        pip install -r requirements.txt
        safety check --json || true

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort ruff flake8

    - name: Check code formatting (Black)
      run: |
        black --check apps/ config/ tests/ || true

    - name: Check import sorting (isort)
      run: |
        isort --check-only apps/ config/ tests/ || true

    - name: Lint with Ruff
      run: |
        ruff check apps/ config/ tests/ || true

    - name: Lint with Flake8
      run: |
        flake8 apps/ config/ --max-line-length=88 --extend-ignore=E203,W503 || true

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: arisk-erm:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  notify:
    runs-on: ubuntu-latest
    needs: [test, security, code-quality]
    if: always()

    steps:
    - name: Check job status
      run: |
        if [[ "${{ needs.test.result }}" == "failure" ]]; then
          echo "❌ Tests failed"
          exit 1
        fi
        if [[ "${{ needs.security.result }}" == "failure" ]]; then
          echo "⚠️ Security checks failed"
        fi
        echo "✅ All checks passed!"
