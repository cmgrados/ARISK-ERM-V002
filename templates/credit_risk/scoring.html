{% extends 'base.html' %}
{% block title_header %}{{ page_title }}{% endblock %}
{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-header bg-info text-white">
        <h3 class="card-title font-weight-bold"><i class="fas fa-user-tag mr-2"></i>Scoring por Segmento</h3>
    </div>
    <div class="card-body text-center py-5">
        <i class="fas fa-tools fa-4x text-muted mb-3"></i>
        <h4>Módulo en Desarrollo</h4>
        <p class="text-muted">Aquí se visualizarán los modelos de scoring para Consumo, Micro, Pequeña Empresa y Mediana Empresa.</p>
        <div class="progress mt-4 mx-auto" style="width: 50%; height: 10px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-info" style="width: 65%"></div>
        </div>
        <p class="small mt-2">Avance: 65%</p>
    </div>
</div>
{% endblock %}
