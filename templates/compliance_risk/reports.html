{% extends 'base.html' %}
{% block title_header %}{{ page_title }}{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm mt-3">
    <div class="card-header text-white" style="background-color: #161065;">
        <h3 class="card-title font-weight-bold"><i class="fas fa-file-signature text-warning mr-2"></i>Reporte para Oficial de Cumplimiento (Oficial)</h3>
    </div>
    <div class="card-body">
        <p>Generador de informes estandarizados para la SBS e instancias gerenciales internas. Seleccione el tipo de anexo normativo a exportar.</p>
        <div class="row text-center mt-4">
            <div class="col-md-4">
                <button class="btn btn-outline-dark w-100 p-3 mb-2"><i class="fas fa-file-pdf fa-2x mb-2 text-danger"></i><br>Informe Trimestral de Cumplimiento Normativo (Inf. Gerencial)</button>
            </div>
            <div class="col-md-4">
                <button class="btn btn-outline-dark w-100 p-3 mb-2"><i class="fas fa-file-excel fa-2x mb-2 text-success"></i><br>Anexo 15 SBS (Brechas de Adaptación Regulatoria)</button>
            </div>
            <div class="col-md-4">
                <button class="btn btn-outline-dark w-100 p-3 mb-2"><i class="fas fa-envelope-open-text fa-2x mb-2 text-primary"></i><br>Declaración de Cumplimiento Directores/Alta Gerencia</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
