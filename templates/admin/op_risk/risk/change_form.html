{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}

{% block object-tools %}
<div style="float: right; margin-bottom: 15px;">
    <button type="button" id="btn-ai-copilot" class="button" style="background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">
        ✨ Autocompletar con IA (Copilot)
    </button>
</div>
{{ block.super }}

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const btnAI = document.getElementById('btn-ai-copilot');
        
        btnAI.addEventListener('click', function(e) {
            e.preventDefault();
            
            const processSelect = document.getElementById('id_process');
            if (!processSelect || !processSelect.value) {
                alert("Por favor, selecciona un Proceso primero para que la IA pueda analizarlo.");
                return;
            }
            
            btnAI.innerHTML = "⏳ Generando sugerencias...";
            btnAI.disabled = true;

            const processId = processSelect.value;
            // Get CSRF token
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            
            fetch('/op-risk/api/ai-copilot/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ process_id: processId })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Populate fields
                    document.getElementById('id_name').value = data.data.suggested_name || '';
                    document.getElementById('id_description').value = data.data.suggested_description || '';
                    document.getElementById('id_cause').value = data.data.suggested_cause || '';
                    document.getElementById('id_consequence').value = data.data.suggested_consequence || '';
                    
                    alert("¡Sugerencias de IA cargadas con éxito! Por favor revisa y edita según sea necesario.");
                } else {
                    alert("Error en la IA: " + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Ocurrió un error al contactar al asistente IA.");
            })
            .finally(() => {
                btnAI.innerHTML = "✨ Autocompletar con IA (Copilot)";
                btnAI.disabled = false;
            });
        });
    });
</script>
{% endblock %}
