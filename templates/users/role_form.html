{% extends 'base.html' %}
{% block content %}
<div class="content-wrapper">
  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="font-weight-bold" style="color: var(--primary-deep);"><i class="fas fa-arrow-right"></i> Nuevo Perfil</h1>
        </div>
        <div class="col-sm-6 text-right">
          <a href="{% url 'users:role_list' %}" class="btn btn-danger" style="background-color: #b82b2b; border-color: #b82b2b;">
            <i class="fas fa-arrow-left"></i> Volver atrás...
          </a>
        </div>
      </div>
    </div>
  </section>

  <section class="content">
    <div class="container-fluid">
      <div class="card" style="border-top: 2px solid #ccc;">
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            <div class="form-group row align-items-center mb-4">
              <label for="name" class="col-sm-2 col-form-label text-muted" style="border: 2px solid red; padding: 5px 10px;">Nombre perfil</label>
              <div class="col-sm-10">
                <input type="text" class="form-control w-25" id="name" name="name" required placeholder="Ej: Contador" style="border-radius: 3px;">
              </div>
            </div>
            <div class="form-group row">
              <div class="col-sm-2"></div>
              <div class="col-sm-10">
                <button type="submit" class="btn btn-success" style="border: 2px solid red; background-color: #5cb85c; font-weight: bold;">Guardar</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</div>
{% endblock %}
