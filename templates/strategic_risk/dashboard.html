{% extends 'base.html' %}
{% block title_header %}{{ page_title }}{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white"><h3 class="card-title font-weight-bold"><i class="fas fa-chart-area mr-2 text-primary"></i>Cumplimiento del Plan Estratégico</h3></div>
            <div class="card-body"><div id="stratLine" style="height: 350px;"></div></div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white"><h3 class="card-title font-weight-bold"><i class="fas fa-tachometer-alt mr-2 text-warning"></i>Riesgo de Incumplimiento</h3></div>
            <div class="card-body"><div id="stratGauge" style="height: 350px;"></div></div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var sLine = echarts.init(document.getElementById('stratLine'));
    sLine.setOption({
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: ['Año 1', 'Año 2', 'Año 3', 'Año 4', 'Año 5'] },
        yAxis: { type: 'value', min: 0, max: 100 },
        series: [
            { name: 'Meta', type: 'line', data: [20, 40, 60, 80, 100], lineStyle: { type: 'dashed' } },
            { name: 'Real', type: 'line', data: [18, 35, 55], itemStyle: { color: '#161065' }, areaStyle: { color: 'rgba(22,16,101,0.1)' } }
        ]
    });

    var sGauge = echarts.init(document.getElementById('stratGauge'));
    sGauge.setOption({
        series: [{
            type: 'gauge',
            progress: { show: true, width: 18 },
            axisLine: { lineStyle: { width: 18 } },
            axisTick: { show: false },
            splitLine: { length: 15, lineStyle: { width: 2, color: '#999' } },
            axisLabel: { distance: 25, color: '#999', fontSize: 14 },
            anchor: { show: true, showAbove: true, size: 25, itemStyle: { borderWidth: 10 } },
            title: { show: false },
            detail: { valueAnimation: true, fontSize: 40, offsetCenter: [0, '70%'], formatter: '{value}%' },
            data: [{ value: 72, name: 'Riesgo' }],
            color: '#ffcc00'
        }]
    });
    window.addEventListener('resize', function(){ sLine.resize(); sGauge.resize(); });
});
</script>
{% endblock %}
