<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta Estratégica</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 40px;
            padding-bottom: 40px;
        }
        .survey-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #1a428a; /* Dark blue corporate color */
            color: white;
            border-top-left-radius: 10px !important;
            border-top-right-radius: 10px !important;
            padding: 20px;
        }
        .form-check-label {
            cursor: pointer;
        }
        .rating-stars {
            color: #ffc107;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .star-item:hover, .star-item.active {
            color: #ffc107;
        }
        .star-item {
            color: #e4e5e9;
        }
    </style>
</head>
<body>

<div class="container survey-container">
    
    <!-- HEADER -->
    <div class="card">
        <div class="card-header text-center">
            <h2 class="mb-0" id="survey-title">Cargando Encuesta...</h2>
            <p class="mt-2 mb-0" id="survey-desc">Por favor, espera mientras cargamos las preguntas.</p>
        </div>
    </div>

    <!-- PREGUNTAS (Se renderizarán aquí) -->
    <form id="public-survey-form">
        <div id="questions-container">
            <!-- Spinner -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
            </div>
        </div>

        <!-- FOOTER / BOTÓN ENVIAR -->
        <div class="card d-none" id="submit-card">
            <div class="card-body text-end">
                <button type="submit" class="btn btn-primary px-4 py-2">
                    <i class="fas fa-paper-plane me-2"></i> Enviar Respuestas
                </button>
            </div>
        </div>
    </form>

    <div class="text-center mt-4 text-muted small">
        <p>&copy; 2026 A.RISK ERM. Todos los derechos reservados.</p>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const surveyId = "{{ survey_id }}";

    // Simulación de carga de datos desde el backend (para fines de la demostración visual actual)
    document.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
            renderMockSurvey();
        }, 1000); // 1 segundo de "carga"
    });

    function renderMockSurvey() {
        // En un caso real, haríamos un fetch() al servidor usando el surveyId
        let title = "Encuesta Estratégica";
        let desc = "Por favor responde las siguientes preguntas con honestidad.";
        
        if (surveyId === "C7L8M9") {
            title = "Encuesta de Clima Laboral 2026";
            desc = "Tu opinión es fundamental para mejorar nuestro ambiente de trabajo.";
        } else if (surveyId === "P2R0C1") {
            title = "Evaluación de Procesos Internos";
            desc = "Identificación de cuellos de botella y oportunidades de mejora.";
        } else if (surveyId === "S4T5I6") {
            title = "Satisfacción del Socio/Cliente";
            desc = "Evalúa la calidad de nuestros servicios y atención.";
        }

        document.getElementById('survey-title').textContent = title;
        document.getElementById('survey-desc').textContent = desc;

        const savedData = localStorage.getItem('survey_' + surveyId);
        const qContainer = document.getElementById('questions-container');
        
        if (savedData) {
            const surveyDataObj = JSON.parse(savedData);
            const questions = surveyDataObj.questions || [];
            
            if (surveyDataObj.title) document.getElementById('survey-title').textContent = surveyDataObj.title;
            if (surveyDataObj.description) document.getElementById('survey-desc').textContent = surveyDataObj.description;
            
            if (questions.length === 0) {
                qContainer.innerHTML = `
                    <div class="alert alert-info text-center">
                        <i class="fas fa-info-circle mb-2" style="font-size: 2rem;"></i><br>
                        Esta encuesta aún no tiene preguntas publicadas.
                    </div>
                `;
                document.getElementById('submit-card').classList.add('d-none');
                return;
            }

            let html = '';
            
            questions.forEach((q, index) => {
                const isRequired = q.required ? '<span class="text-danger">*</span>' : '';
                let specificHtml = '';
                
                if (q.type === 'text') {
                    specificHtml = `<input type="text" class="form-control mt-3" placeholder="Tu respuesta corta..." ${q.required ? 'required' : ''}>`;
                } else if (q.type === 'textarea') {
                    specificHtml = `<textarea class="form-control mt-3" rows="4" placeholder="Escribe tu respuesta aquí..." ${q.required ? 'required' : ''}></textarea>`;
                } else if (q.type === 'radio' || q.type === 'checkbox') {
                    q.options.forEach((opt, i) => {
                        specificHtml += `
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="${q.type}" name="q_${index}" value="${opt}" id="q_${index}_opt_${i}" ${q.required && q.type==='radio' ? 'required' : ''}>
                                <label class="form-check-label" for="q_${index}_opt_${i}">${opt}</label>
                            </div>
                        `;
                    });
                } else if (q.type === 'rating') {
                    specificHtml = `
                        <div class="rating-stars mt-3">
                            <i class="fas fa-star star-item" data-val="1"></i>
                            <i class="fas fa-star star-item" data-val="2"></i>
                            <i class="fas fa-star star-item" data-val="3"></i>
                            <i class="fas fa-star star-item" data-val="4"></i>
                            <i class="fas fa-star star-item" data-val="5"></i>
                            <input type="hidden" name="q_${index}" value="" ${q.required ? 'required' : ''}>
                        </div>
                    `;
                }

                html += `
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">${index + 1}. ${q.title || 'Pregunta sin título'} ${isRequired}</h5>
                            ${specificHtml}
                        </div>
                    </div>
                `;
            });
            
            qContainer.innerHTML = html;
        } else {
            // Si no hay datos (ej. primera vez), mostrar un mensaje vacío o el dummy
            qContainer.innerHTML = `
                <div class="alert alert-info text-center">
                    <i class="fas fa-info-circle mb-2" style="font-size: 2rem;"></i><br>
                    Esta encuesta aún no tiene preguntas publicadas.
                </div>
            `;
            document.getElementById('submit-card').classList.add('d-none');
            return;
        }

        // Mostrar botón
        document.getElementById('submit-card').classList.remove('d-none');

        // Lógica para estrellas de calificación
        document.querySelectorAll('.star-item').forEach(star => {
            star.addEventListener('click', function() {
                const val = parseInt(this.getAttribute('data-val'));
                const siblings = this.parentElement.querySelectorAll('.star-item');
                this.parentElement.querySelector('input[type="hidden"]').value = val;
                
                siblings.forEach(s => {
                    if (parseInt(s.getAttribute('data-val')) <= val) {
                        s.classList.add('active', 'text-warning');
                        s.classList.remove('text-muted', 'text-light');
                    } else {
                        s.classList.remove('active', 'text-warning');
                        s.classList.add('text-muted');
                    }
                });
            });
        });
    }

    // Manejo del envío
    document.getElementById('public-survey-form').addEventListener('submit', function(e) {
        e.preventDefault();
        Swal.fire({
            title: '¡Respuestas Enviadas!',
            text: 'Gracias por tu tiempo y colaboración.',
            icon: 'success',
            confirmButtonColor: '#1a428a'
        }).then(() => {
            // Recargar o mostrar mensaje de agradecimiento
            document.body.innerHTML = `
                <div class="container text-center" style="margin-top: 100px;">
                    <i class="fas fa-check-circle text-success" style="font-size: 5rem;"></i>
                    <h2 class="mt-4">¡Gracias!</h2>
                    <p class="text-muted">Tus respuestas han sido registradas exitosamente.</p>
                </div>
            `;
        });
    });
</script>
</body>
</html>
