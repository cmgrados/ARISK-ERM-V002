{% extends 'base.html' %}

{% block title_header %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center mt-5">
        <div class="card shadow-sm border-0" style="border-top: 4px solid #161065 !important;">
            <div class="card-body p-5">
                <i class="fas fa-tools text-indigo mb-4" style="font-size: 4rem;"></i>
                <h2 class="font-weight-bold">{{ title }}</h2>
                <p class="text-muted mt-3 mb-4" style="font-size: 1.1rem;">
                    Esta sección se encuentra actualmente en desarrollo y pronto estará disponible.
                </p>
                <a href="{% url 'financial_planning:dashboard' %}" class="btn btn-indigo shadow-sm px-4 py-2 font-weight-bold">
                    <i class="fas fa-arrow-left mr-2"></i> Volver al Panel Principal
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
